<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Space Aura -->
    <radialGradient id="spaceAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#090a12" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090a12" stop-opacity="0"/>
    </radialGradient>

    <!-- Mobius Endless Loop Gradient -->
    <linearGradient id="mobiusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="28%" stop-color="#3b82f6"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Film Reel Rim Gradient -->
    <linearGradient id="reelRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gravity Wave Gradient -->
    <radialGradient id="waveGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Central Diamond Core Gradient -->
    <linearGradient id="coreDiamond" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Specular Highlight Sheen Gradient -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- High Performance Neon Glow Filter -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Intense Core Bloom Filter -->
    <filter id="coreBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="bigBlur"/>
      <feGaussianBlur stdDeviation="4" result="sharpBlur"/>
      <feMerge>
        <feMergeNode in="bigBlur"/>
        <feMergeNode in="sharpBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="256" cy="256" r="236" fill="url(#spaceAura)"/>

  <!-- Radiant Gravity Waveform Rings (Concentric Harmonic Ripples) -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="128" fill="url(#waveGlow)"/>

  <!-- Film Reel Aperture: Outer Track & Sprocket Flanges -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#reelRim)" stroke-width="4" stroke-opacity="0.85"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Film Reel Radial Perforation Sprockets (12 Aperture Slots) -->
  <g id="sprockets" stroke="#0284c7" stroke-width="1.5" fill="#0b0f19" opacity="0.9">
    <!-- 12 Sprocket Slots around rim r=196 -->
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(0 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(30 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(60 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(90 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(120 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(150 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(180 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(210 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(240 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(270 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(300 256 256)"/>
    <rect x="250" y="52" width="12" height="16" rx="3" transform="rotate(330 256 256)"/>
  </g>

  <!-- Orbital Tilted Planetary Ellipse (Antigravity Field Vector) -->
  <ellipse cx="256" cy="256" rx="200" ry="78" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="14 10" transform="rotate(-28 256 256)" opacity="0.6"/>

  <!-- The Endless Mobius Loop Ribbon (Infinity Loop Symbol of Smooth Looping) -->
  <path d="M 154,256 C 154,196 206,176 256,256 C 306,336 358,316 358,256 C 358,196 306,176 256,256 C 206,336 154,316 154,256 Z"
        fill="none"
        stroke="url(#mobiusGradient)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Secondary Inner Loop Accent Line -->
  <path d="M 154,256 C 154,196 206,176 256,256 C 306,336 358,316 358,256"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.8"
        filter="url(#neonGlow)"/>

  <path d="M 358,256 C 358,196 306,176 256,256 C 206,336 154,316 154,256"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.45"/>

  <!-- Levitating Antigravity Quantum Prism / Play Core -->
  <g transform="translate(256, 256)">
    <!-- Back Glow Pulse -->
    <circle cx="0" cy="0" r="38" fill="#38bdf8" opacity="0.25" filter="url(#coreBloom)"/>

    <!-- Central Diamond Core Polygon -->
    <polygon points="0,-46 36,0 0,46 -36,0" fill="url(#coreDiamond)" filter="url(#coreBloom)"/>

    <!-- Geometric Facet Highlights -->
    <polygon points="0,-46 36,0 0,5" fill="#ffffff" opacity="0.38"/>
    <polygon points="0,-46 -36,0 0,5" fill="#67e8f9" opacity="0.22"/>
    <polygon points="0,5 36,0 0,46" fill="#0369a1" opacity="0.5"/>
    <polygon points="0,5 -36,0 0,46" fill="#1e1b4b" opacity="0.6"/>

    <!-- Crisp Diamond Outline -->
    <polygon points="0,-46 36,0 0,46 -36,0" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.9"/>

    <!-- Studio Playhead Motion Marker -->
    <polygon points="-5,-11 12,0 -5,11" fill="#ffffff" filter="url(#neonGlow)"/>
  </g>

  <!-- Orbital Energy Sparkles / Photons -->
  <circle cx="120" cy="172" r="4.5" fill="#00f0ff" filter="url(#neonGlow)"/>
  <circle cx="392" cy="160" r="5" fill="#a855f7" filter="url(#neonGlow)"/>
  <circle cx="388" cy="345" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
  <circle cx="115" cy="330" r="3.5" fill="#ec4899" filter="url(#neonGlow)"/>
  <circle cx="256" cy="36" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="256" cy="476" r="3" fill="#38bdf8" opacity="0.8"/>
  <circle cx="68" cy="256" r="3" fill="#818cf8" opacity="0.75"/>
  <circle cx="444" cy="256" r="3" fill="#06b6d4" opacity="0.75"/>
</svg>
