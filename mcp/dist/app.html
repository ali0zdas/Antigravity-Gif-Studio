<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity GIF Studio</title>
  <style>:root {
  --bg-primary: var(--color-background-primary, #0f1117);
  --bg-secondary: var(--color-background-secondary, #171a23);
  --bg-tertiary: var(--color-background-tertiary, #1f2430);
  --bg-inverse: var(--color-background-inverse, #f8fafc);
  --bg-info: var(--color-background-info, rgba(99, 102, 241, 0.14));
  --bg-success: var(--color-background-success, rgba(16, 185, 129, 0.14));
  --bg-warning: var(--color-background-warning, rgba(245, 158, 11, 0.14));
  --bg-danger: var(--color-background-danger, rgba(239, 68, 68, 0.14));

  --text-primary: var(--color-text-primary, #f1f5f9);
  --text-secondary: var(--color-text-secondary, #94a3b8);
  --text-tertiary: var(--color-text-tertiary, #64748b);
  --text-inverse: var(--color-text-inverse, #0f172a);
  --text-info: var(--color-text-info, #818cf8);
  --text-success: var(--color-text-success, #34d399);
  --text-warning: var(--color-text-warning, #fbbf24);
  --text-danger: var(--color-text-danger, #f87171);

  --border-primary: var(--color-border-primary, #2a3040);
  --border-secondary: var(--color-border-secondary, #1e2330);
  --ring-primary: var(--color-ring-primary, #6366f1);

  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 12px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.studio-shell {
  width: 100%;
  max-width: 960px;
  margin: 0 auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.studio-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-secondary);
  flex-wrap: wrap;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.brand-badge {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: linear-gradient(135deg, #6366f1, #06b6d4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  flex-shrink: 0;
}

.studio-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border-primary);
  background: var(--bg-secondary);
  color: var(--text-secondary);
}

.pill.success {
  background: var(--bg-success);
  color: var(--text-success);
  border-color: transparent;
}

.pill.warning {
  background: var(--bg-warning);
  color: var(--text-warning);
  border-color: transparent;
}

.pill.info {
  background: var(--bg-info);
  color: var(--text-info);
  border-color: transparent;
}

.toolbar-tabs {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.tab-group {
  display: inline-flex;
  background: var(--bg-secondary);
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-sm);
  padding: 2px;
  gap: 2px;
}

.tab-btn {
  border: none;
  background: transparent;
  color: var(--text-secondary);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.tab-btn:hover {
  color: var(--text-primary);
}

.tab-btn.active {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.stage-card {
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-secondary);
}

.stage-viewport {
  position: relative;
  width: 100%;
  min-height: 240px;
  max-height: 420px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow: hidden;
}

.stage-viewport.bg-checkerboard {
  background-color: #1c202b;
  background-image:
    linear-gradient(45deg, #272c3a 25%, transparent 25%),
    linear-gradient(-45deg, #272c3a 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #272c3a 75%),
    linear-gradient(-45deg, transparent 75%, #272c3a 75%);
  background-size: 20px 20px;
  background-position: 0 0, 0 10px, 10px -10px, -10px 0;
}

.stage-viewport.bg-dark {
  background: #0b0c10;
}

.stage-viewport.bg-light {
  background: #ffffff;
}

.stage-viewport.bg-host {
  background: var(--bg-primary);
}

.stage-svg-host {
  width: 100%;
  height: 100%;
  max-height: 380px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-svg-host svg {
  max-width: 100%;
  max-height: 360px;
  width: auto;
  height: auto;
  display: block;
}

.stage-gif-preview {
  max-width: 100%;
  max-height: 360px;
  display: none;
  border-radius: var(--radius-sm);
  object-fit: contain;
}

.stage-empty {
  text-align: center;
  padding: 28px 16px;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.stage-empty strong {
  color: var(--text-primary);
  font-size: 14px;
}

.timeline-bar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--border-secondary);
  background: var(--bg-secondary);
}

.scrubber-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.scrubber {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}

.time-readout {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  color: var(--text-secondary);
  min-width: 96px;
  text-align: right;
}

.controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}

.btn:hover:not(:disabled) {
  border-color: var(--ring-primary);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn.chip {
  padding: 3px 7px;
  font-size: 11px;
}

.btn.chip.active {
  background: var(--bg-info);
  color: var(--text-info);
  border-color: var(--ring-primary);
}

.panel-card {
  border: 1px solid var(--border-primary);
  border-radius: var(--radius-md);
  background: var(--bg-secondary);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.panel-card[hidden] {
  display: none;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
}

.input,
.select,
.textarea {
  width: 100%;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-primary);
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 12px;
  font-family: inherit;
}

.textarea {
  min-height: 110px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  resize: vertical;
}

.input:focus,
.select:focus,
.textarea:focus {
  outline: none;
  border-color: var(--ring-primary);
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-top: 18px;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
}

.actions-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.status-banner {
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  border: 1px solid var(--border-primary);
  background: var(--bg-tertiary);
}

.status-banner[hidden] {
  display: none;
}

.status-banner.success {
  background: var(--bg-success);
  color: var(--text-success);
  border-color: transparent;
}

.status-banner.error {
  background: var(--bg-danger);
  color: var(--text-danger);
  border-color: transparent;
}

.status-banner.info {
  background: var(--bg-info);
  color: var(--text-info);
  border-color: transparent;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 260px;
  overflow-y: auto;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-secondary);
  background: var(--bg-primary);
  cursor: pointer;
}

.history-item:hover {
  border-color: var(--ring-primary);
}

.history-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.history-name {
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-sub {
  font-size: 11px;
  color: var(--text-secondary);
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  word-break: break-all;
}
</style>
</head>
<body>
  <div class="studio-shell">
    <header class="studio-header">
      <div class="brand-group">
        <span class="brand-badge">GS</span>
        <span id="studio-title" class="studio-title">Antigravity GIF Studio</span>
      </div>
      <div class="header-badges">
        <span id="badge-dims" class="pill" hidden></span>
        <span id="badge-seam" class="pill" hidden></span>
        <span id="badge-size" class="pill" hidden></span>
      </div>
    </header>

    <div class="toolbar-tabs">
      <div class="tab-group" role="tablist">
        <button class="tab-btn active" data-tab="export" type="button">Export &amp; Playback</button>
        <button class="tab-btn" data-tab="optimize" type="button">Optimize GIF</button>
        <button class="tab-btn" data-tab="source" type="button">SVG Source</button>
        <button class="tab-btn" data-tab="history" type="button">History</button>
      </div>
      <div class="btn-group">
        <button class="btn chip active" data-bg="checkerboard" type="button">Checker</button>
        <button class="btn chip" data-bg="dark" type="button">Dark</button>
        <button class="btn chip" data-bg="light" type="button">Light</button>
        <button class="btn chip" data-bg="host" type="button">Host</button>
      </div>
    </div>

    <section class="stage-card">
      <div id="stage-viewport" class="stage-viewport bg-checkerboard">
        <div id="stage-svg-host" class="stage-svg-host"></div>
        <img id="stage-gif-preview" class="stage-gif-preview" alt="Rendered GIF Preview" />
        <div id="stage-empty" class="stage-empty">
          <strong>No SVG or GIF loaded yet</strong>
          <span>Ask the agent to generate an animation, paste SVG in the SVG Source tab, or pick an item from History.</span>
        </div>
      </div>

      <div class="timeline-bar">
        <div class="scrubber-row">
          <input id="scrubber" class="scrubber" type="range" min="0" max="1000" value="0" />
          <span id="time-readout" class="time-readout">0.00s / 2.00s</span>
        </div>

        <div class="controls-row">
          <div class="btn-group">
            <button id="btn-play" class="btn primary" type="button">Pause</button>
            <button id="btn-step-back" class="btn chip" type="button" title="Previous frame">&lt;</button>
            <button id="btn-step-fwd" class="btn chip" type="button" title="Next frame">&gt;</button>
            <button id="btn-toggle-view" class="btn chip" type="button" hidden>View Rendered GIF</button>
          </div>

          <div class="btn-group" id="speed-group">
            <button class="btn chip" data-speed="0.25" type="button">0.25x</button>
            <button class="btn chip" data-speed="0.5" type="button">0.5x</button>
            <button class="btn chip active" data-speed="1" type="button">1x</button>
            <button class="btn chip" data-speed="1.5" type="button">1.5x</button>
            <button class="btn chip" data-speed="2" type="button">2x</button>
            <button class="btn chip" data-speed="3" type="button">3x</button>
          </div>
        </div>
      </div>
    </section>

    <div id="status-banner" class="status-banner" hidden>
      <span id="status-text"></span>
      <span id="status-path" class="mono"></span>
    </div>

    <section id="tab-export" class="panel-card">
      <div class="form-grid">
        <div class="field">
          <label for="input-fps">FPS</label>
          <select id="input-fps" class="select">
            <option value="10">10 fps</option>
            <option value="15">15 fps</option>
            <option value="20" selected>20 fps</option>
            <option value="24">24 fps</option>
            <option value="30">30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </div>
        <div class="field">
          <label for="input-duration">Duration (s)</label>
          <input id="input-duration" class="input" type="number" step="0.1" min="0.1" max="60" value="2.0" />
        </div>
        <div class="field">
          <label for="input-colors">Max Colors</label>
          <select id="input-colors" class="select">
            <option value="16">16 colors</option>
            <option value="64">64 colors</option>
            <option value="128">128 colors</option>
            <option value="256" selected>256 colors</option>
          </select>
        </div>
        <div class="field">
          <label for="input-width">Width (px)</label>
          <input id="input-width" class="input" type="number" min="1" max="4000" placeholder="Auto" />
        </div>
        <div class="field">
          <label for="input-height">Height (px)</label>
          <input id="input-height" class="input" type="number" min="1" max="3000" placeholder="Auto" />
        </div>
        <div class="field">
          <label for="input-filename">Filename</label>
          <input id="input-filename" class="input" type="text" value="antigravity-studio-export.gif" />
        </div>
        <label class="checkbox-row">
          <input id="input-transparent" type="checkbox" />
          <span>Transparent BG</span>
        </label>
      </div>

      <div class="actions-footer">
        <div class="btn-group">
          <button id="btn-render-gif" class="btn primary" type="button">Render GIF</button>
          <button id="btn-save-pictures" class="btn" type="button" disabled>Save to Pictures</button>
          <button id="btn-save-as" class="btn" type="button" disabled>Save As...</button>
          <button id="btn-open-folder" class="btn" type="button" disabled>Reveal Folder</button>
          <button id="btn-open-file" class="btn" type="button" hidden>Open File Tab</button>
        </div>

        <div class="btn-group">
          <button id="btn-attach-context" class="btn" type="button" hidden>Attach Settings</button>
          <button id="btn-send-agent" class="btn" type="button" hidden>Regenerate in Chat</button>
        </div>
      </div>
    </section>

    <section id="tab-optimize" class="panel-card" hidden>
      <div class="form-grid">
        <div class="field">
          <label for="opt-input-path">Input GIF Path (optional if already rendered)</label>
          <input id="opt-input-path" class="input" type="text" placeholder="e.g. output.gif" />
        </div>
        <div class="field">
          <label for="opt-colors">Target Colors</label>
          <select id="opt-colors" class="select">
            <option value="16">16 colors</option>
            <option value="32">32 colors</option>
            <option value="64">64 colors</option>
            <option value="128" selected>128 colors</option>
            <option value="256">256 colors</option>
          </select>
        </div>
        <div class="field">
          <label for="opt-lossy">Lossy (0-100)</label>
          <input id="opt-lossy" class="input" type="number" min="0" max="100" value="20" />
        </div>
        <label class="checkbox-row">
          <input id="opt-dedup" type="checkbox" checked />
          <span>Deduplicate Frames</span>
        </label>
      </div>

      <div class="actions-footer">
        <button id="btn-optimize-gif" class="btn primary" type="button">Optimize GIF</button>
        <span id="opt-stats" class="pill" hidden></span>
      </div>
    </section>

    <section id="tab-source" class="panel-card" hidden>
      <div class="field">
        <label for="svg-source-editor">SVG Markup</label>
        <textarea id="svg-source-editor" class="textarea" placeholder="Paste <svg ...>...</svg> markup here"></textarea>
      </div>
      <div class="actions-footer">
        <button id="btn-apply-svg" class="btn primary" type="button">Apply SVG to Stage</button>
      </div>
    </section>

    <section id="tab-history" class="panel-card" hidden>
      <div class="actions-footer">
        <span class="history-sub">Recent animations stored on the local MCP server</span>
        <button id="btn-refresh-history" class="btn chip" type="button">Refresh</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
