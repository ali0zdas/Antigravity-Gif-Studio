<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect x="50" y="50" width="100" height="100" fill="#a855f7" rx="10">
    <animate attributeName="opacity" values="0.2;1.0;0.2" dur="2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="2s" repeatCount="indefinite" />
  </rect>
</svg>
