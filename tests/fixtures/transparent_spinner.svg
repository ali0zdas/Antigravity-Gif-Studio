<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      .spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinCycle 1s linear infinite;
      }
      @keyframes spinCycle {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>
  <!-- No background rect -> 100% transparent alpha -->
  <g class="spin">
    <circle cx="60" cy="20" r="10" fill="#f59e0b" />
    <circle cx="95" cy="40" r="8" fill="#f59e0b" opacity="0.8" />
    <circle cx="95" cy="80" r="6" fill="#f59e0b" opacity="0.6" />
    <circle cx="60" cy="100" r="4" fill="#f59e0b" opacity="0.4" />
    <circle cx="25" cy="80" r="3" fill="#f59e0b" opacity="0.2" />
  </g>
</svg>
