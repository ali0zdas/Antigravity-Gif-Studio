<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <style>
      .laser {
        animation: beamSweep 1.5s ease-in-out infinite alternate;
      }
      @keyframes beamSweep {
        from { transform: translateX(50px); }
        to { transform: translateX(1100px); }
      }
    </style>
  </defs>
  <rect width="1200" height="200" fill="#0f172a" />
  <circle class="laser" cx="0" cy="100" r="25" fill="#38bdf8" />
</svg>
